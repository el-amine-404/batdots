PROFILE=homelab

# Phase 1 -- system configuration tasks, run in order.
SYSTEM_TASKS=(
  local-init        # seed local/*.example -> local/*
  repos             # extra apt sources (Debian/Ubuntu); harmless on derivatives
  sudoers           # ensure $USER is in the sudo group
  disable-lid-sleep # disable suspend on lid close
  homelab-dirs      # configure homelab storage and configs directory structure
  homelab-symlink-env # link global .env to service subfolders
  user-services     # enable systemd user services/timers
)

# Phase 2 -- package groups (config/packages/<group>.txt).
PACKAGES=(
  core
  network
)

# Phase 3 -- external builds/installs.
EXTERNAL=(
  docker
)

# Phase 4 -- symlink maps.
SYMLINKS=(
  common
)
