PROFILE=homelab

# Phase 1 -- system configuration tasks, run in order.
SYSTEM_TASKS=(
  local-init          # seed local/*.example -> local/*
  repos               # extra apt sources (Debian/Ubuntu); harmless on derivatives
  sudoers             # ensure $USER is in the sudo group
  unattended-upgrades # automatic security patches
  firewall            # ufw: default-deny inbound, allow SSH/Caddy/LAN services
  ssh-hardening       # key-only auth (lock-out-safe), no root login
  fail2ban            # SSH brute-force protection
  clamav              # AV engine + auto-updating signatures
  disable-lid-sleep   # disable suspend on lid close
  homelab-dirs        # configure homelab storage and configs directory structure
  media-noexec        # mount the media tree noexec,nosuid,nodev
  homelab-symlink-env # link global .env to service subfolders
  user-services       # enable systemd user services/timers (incl. media scan)
)

# Phase 2 -- package groups (config/packages/<group>.txt).
PACKAGES=(
  core
  cli-tools # bat/ripgrep/fd/eza/dust from the distro, no rust toolchain needed
  network
  security # ufw, fail2ban, lynis, auditd, rkhunter, clamav -- audit/hardening tools
)

# Phase 3 -- external builds/installs.
EXTERNAL=(
  docker
)

# Phase 4 -- symlink maps.
SYMLINKS=(
  common
)
