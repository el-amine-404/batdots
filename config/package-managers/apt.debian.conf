# config/package-managers/apt.debian.conf
# Debian-specific overrides. Consulted before apt.conf; an empty value means
# "no equivalent on this distro, skip it".

# neofetch was archived upstream and dropped from Debian; fastfetch replaces it.
neofetch=fastfetch

# software-properties-* is Ubuntu PPA tooling with no Debian counterpart.
software-properties-gtk=
software-properties-common=
